<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebMind AI</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="app">

        <header class="header">
            <h2>WebMind AI</h2>
            <span>Your AI Web Assistant</span>
        </header>

        <section class="page-info">
            <div class="status">
                <span class="status-dot"></span>
                <span id="statusText">Connecting to webpage...</span>
            </div>

            <h3 id="pageTitle">Loading page...</h3>
            <p id="pageUrl"></p>

            <div class="content-stats">
                <span id="wordCount">0 words</span>
                <span id="charCount">0 characters</span>
            </div>
        </section>


        <main class="chat-container">

            <div id="chatMessages" class="chat-messages">

                <div class="message ai-message">
                    <div class="message-label">WebMind AI</div>
                    <div class="message-bubble">
                        Hello! I've analyzed this webpage.
                        Ask me anything about its content.
                    </div>
                </div>

            </div>

        </main>

        <footer class="input-container">

            <input type="text" id="questionInput" placeholder="Ask anything about this page..." disabled>

            <button id="sendBtn" disabled>➤</button>

        </footer>


    </div>

    <script src="popup.js"></script>

</body>

</html>
